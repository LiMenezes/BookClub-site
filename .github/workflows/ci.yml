name: BookClub checks
on:
  push:
    branches: [main, codex/bookclub-publicacao]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bookclub-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: bookclub_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d bookclub_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Check PostgreSQL client tools
        run: pg_dump --version && pg_restore --version
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/bookclub_ci
