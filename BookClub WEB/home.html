<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookClub - Início</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand"><img src="logo.jpg" class="sidebar-logo"><span>BookClub</span></div>
            <nav class="sidebar-menu">
                <a href="home.html" class="nav-item active"><i class="fa-solid fa-house"></i> Início</a>
                <a href="estante.html" class="nav-item"><i class="fa-solid fa-book-open"></i> Meus Livros</a>
                <a href="descobrir.html" class="nav-item"><i class="fa-solid fa-compass"></i> Descobrir</a>
                <a href="perfil.html" class="nav-item"><i class="fa-solid fa-user"></i> Perfil</a>
            </nav>
            <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
        </aside>

        <section class="content-area">
            <header class="view-header">
                <div>
                    <h1>Olá, <span id="home-display-name">Leitor</span>! 👋</h1>
                    <p class="subtitle">Mergulhe nas resenhas e acompanhe sua meta anual.</p>
                </div>
                <div class="user-pill"><span id="home-display-handle">@user</span><img id="home-avatar" src=""></div>
            </header>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 40px;">
                <div style="background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 24px; border-radius: 12px;">
                    <h3 style="font-size: 1rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 12px;">Progresso Meta Anual</h3>
                    <div style="background-color: var(--bg-input); height: 12px; border-radius: 6px; overflow: hidden; margin-bottom: 8px;">
                        <div id="home-goal-fill" style="background: linear-gradient(90deg, #3b82f6, #60a5fa); height: 100%; width: 0%;"></div>
                    </div>
                    <p id="home-goal-text" style="font-size: 0.88rem; color: var(--text-muted);"></p>
                </div>
                <div style="background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 24px; border-radius: 12px; display: flex; align-items: center; gap: 15px;">
                    <img src="https://images-na.ssl-images-amazon.com/images/I/81A16vVb06L.jpg" style="width: 50px; height: 72px; object-fit: cover; border-radius: 4px; cursor: pointer;" onclick="openBookModal('o-segredo-da-empregada')">
                    <div>
                        <h3 style="font-size: 0.85rem; color: var(--accent-blue); text-transform: uppercase; margin-bottom: 2px;">Lendo Atualmente</h3>
                        <h4 style="font-size: 1.05rem;">O Segredo da Empregada</h4>
                        <p style="font-size: 0.82rem; color: var(--text-muted);">Freida McFadden</p>
                    </div>
                </div>
            </div>

            <h2>Atividade Recente dos Leitores</h2>
            <div id="global-activity-feed" style="display: flex; flex-direction: column; gap: 14px; margin-top: 15px;"></div>
        </section>
    </div>
    <script src="livrosData.js"></script>
    <script src="home.js"></script>
</body>
</html>
