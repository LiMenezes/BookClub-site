<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookClub - Perfil</title>
    <link rel="stylesheet" href="home.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-layout { display: grid; grid-template-columns: 1fr 1.2fr; gap: 30px; align-items: start; }
        .card-box { background-color: var(--bg-card); border: 1px solid var(--border-color); padding: 26px; border-radius: 12px; }
        .form-row { margin-bottom: 15px; }
        .form-row label { display: block; font-size: 0.72rem; font-weight: 700; color: var(--text-muted); margin-bottom: 6px; }
        .form-row input, .form-row textarea { width: 100%; background-color: var(--bg-main); border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 6px; color: white; font-size: 0.9rem; }
        .form-row-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .btn-save { background-color: var(--accent-blue); color: white; border: none; padding: 12px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 5px; }
        .timeline-box { display: flex; flex-direction: column; gap: 12px; margin-top: 20px; }
        .timeline-item { background-color: var(--bg-main); border-left: 3px solid var(--accent-blue); padding: 12px 16px; border-radius: 0 8px 8px 0; }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-brand"><img src="logo.jpg" class="sidebar-logo"><span>BookClub</span></div>
            <nav class="sidebar-menu">
                <a href="home.html" class="nav-item"><i class="fa-solid fa-house"></i> Início</a>
                <a href="estante.html" class="nav-item"><i class="fa-solid fa-book-open"></i> Meus Livros</a>
                <a href="descobrir.html" class="nav-item"><i class="fa-solid fa-compass"></i> Descobrir</a>
                <a href="perfil.html" class="nav-item active"><i class="fa-solid fa-user"></i> Perfil</a>
            </nav>
            <button class="btn-logout" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Sair</button>
        </aside>

        <section class="content-area">
            <header class="view-header">
                <div>
                    <h1>Seu Perfil Literário</h1>
                    <p class="subtitle">Customize seus dados e reveja seu histórico.</p>
                </div>
            </header>

            <div class="profile-layout">
                <div>
                    <div class="card-box" style="text-align: center; margin-bottom: 25px;">
                        <img id="p-card-avatar" src="" style="width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--accent-blue); object-fit: cover; margin-bottom: 12px;">
                        <h2 id="p-card-name" style="font-size: 1.35rem;">-</h2>
                        <p id="p-card-handle" style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 12px;">@username</p>
                        <p id="p-card-bio" style="font-size: 0.9rem; color: #cbd5e1; line-height: 1.4;"></p>
                    </div>

                    <div class="card-box">
                        <h3 style="font-size: 1rem; margin-bottom: 15px;">Histórico de Críticas (Sua Timeline)</h3>
                        <div id="p-timeline" class="timeline-box"></div>
                    </div>
                </div>

                <div class="card-box">
                    <h3 style="font-size: 1.05rem; margin-bottom: 18px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">Editar Dados da Conta</h3>
                    <form id="form-edit-profile">
                        <div class="form-row">
                            <label>NOME EXIBIDO</label>
                            <input type="text" id="edit-name" required>
                        </div>
                        <div class="form-row">
                            <label>URL DO AVATAR CUSTOMIZADO (OPCIONAL)</label>
                            <input type="text" id="edit-avatar" placeholder="Deixe em branco para manter seu avatar padrão original">
                        </div>
                        <div class="form-row">
                            <label>SUA BIOGRAFIA</label>
                            <textarea id="edit-bio" rows="3"></textarea>
                        </div>
                        <div class="form-row-grid">
                            <div class="form-row">
                                <label>GÊNERO FAVORITO</label>
                                <input type="text" id="edit-genre">
                            </div>
                            <div class="form-row">
                                <label>META DE LIVROS / ANO</label>
                                <input type="number" id="edit-target" min="1">
                            </div>
                        </div>
                        <button type="submit" class="btn-save">Salvar Alterações</button>
                    </form>
                </div>
            </div>
        </section>
    </div>
    <script src="livrosData.js"></script>
    <script src="perfil.js"></script>
</body>
</html>
